name: Micha Stocks Daily Digest

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if it is not 9 AM in Asia/Jerusalem"
        required: false
        default: "1"
  schedule:
    # Retry during the 9 AM Israel-time window. The duplicate sends are guarded
    # by Resend Idempotency-Key, and the script only accepts videos published
    # before 9:00 AM Asia/Jerusalem.
    - cron: "17,32,47 6 * * *"
    - cron: "17,32,47 7 * * *"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Send Micha Stocks digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
          YOUTUBE_CHANNEL_HANDLE: ${{ vars.YOUTUBE_CHANNEL_HANDLE }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: node scripts/micha-stocks-digest.mjs
