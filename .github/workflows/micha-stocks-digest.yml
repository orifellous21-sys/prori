name: Micha Stocks Daily Digest

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if it is not 9 AM in Asia/Jerusalem"
        required: false
        default: "1"
  schedule:
    # Retry throughout the day because GitHub can delay scheduled workflows by hours.
    # The script skips anything before 9 AM Asia/Jerusalem and Resend
    # Idempotency-Key prevents duplicate emails for the same date/video.
    - cron: "17,47 * * * *"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
      YOUTUBE_CHANNEL_HANDLE: ${{ vars.YOUTUBE_CHANNEL_HANDLE }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Send Micha Stocks morning digest
        env:
          DIGEST_MODE: morning
        run: node scripts/micha-stocks-digest.mjs
      - name: Send Micha Stocks opening live digest
        continue-on-error: true
        env:
          DIGEST_MODE: opening
        run: node scripts/micha-stocks-digest.mjs
      - name: Send Micha Stocks closing live digest
        continue-on-error: true
        env:
          DIGEST_MODE: closing
        run: node scripts/micha-stocks-digest.mjs
