name: Daily Quote Video Email

permissions:
  contents: write

concurrency:
  group: daily-quote-video-email
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if it is before 16:00 in Asia/Jerusalem"
        required: false
        default: "1"
  schedule:
    # GitHub scheduled workflows can be delayed or occasionally skipped.
    # Retry frequently during the Israel afternoon/evening; the scripts still
    # skip before 16:00 Asia/Jerusalem and state/idempotency prevent duplicates.
    - cron: "*/10 12-22 * * *"

jobs:
  send-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video dependencies
        run: python -m pip install --upgrade pillow imageio-ffmpeg
      - name: Generate and email daily quote video
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM_EMAIL }}
          DAILY_QUOTE_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL || 'ori.fellous21@gmail.com' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: python viral-video-automation/DAILY_QUOTE_VIDEO_EMAIL.py
      - name: Upload daily quote video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: python viral-video-automation/UPLOAD_DAILY_QUOTE_TO_YOUTUBE.py
      - name: Upload daily quote video to TikTok
        if: ${{ vars.TIKTOK_UPLOAD_ENABLED == '1' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: python viral-video-automation/UPLOAD_DAILY_QUOTE_TO_TIKTOK.py
      - name: Record YouTube upload state
        run: |
          if [ -n "$(git status --short viral-video-automation/youtube_uploads viral-video-automation/tiktok_uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add viral-video-automation/youtube_uploads viral-video-automation/tiktok_uploads
            git commit -m "Record daily quote social upload"
            git push
          else
            echo "No social upload state changes to commit."
          fi
      - name: Keep rendered video for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-quote-video
          path: viral-video-automation/output/daily_quote/*.mp4
          if-no-files-found: ignore
          retention-days: 7
