name: Daily Quote Video Email

permissions:
  contents: write

concurrency:
  group: daily-quote-video-email
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-quote-video.yml"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even if it is before 16:00 in Asia/Jerusalem"
        required: false
        default: "1"
  schedule:
    # Same proven scheduling pattern as the existing Micha Stocks workflow:
    # retry throughout the day because GitHub can delay scheduled workflows.
    # The script skips anything before 16:00 Asia/Jerusalem and Resend's
    # idempotency key prevents duplicate emails for the same date.
    - cron: "17,47 * * * *"

jobs:
  send-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video dependencies
        run: python -m pip install --upgrade pillow imageio-ffmpeg
      - name: Generate and email daily quote video
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM_EMAIL }}
          DAILY_QUOTE_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL || 'ori.fellous21@gmail.com' }}
          FORCE_SEND: ${{ github.event_name == 'push' && '1' || github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: python viral-video-automation/DAILY_QUOTE_VIDEO_EMAIL.py
      - name: Upload daily quote video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          FORCE_SEND: ${{ github.event_name == 'push' && '1' || github.event_name == 'workflow_dispatch' && inputs.force_send || '0' }}
        run: python viral-video-automation/UPLOAD_DAILY_QUOTE_TO_YOUTUBE.py
      - name: Record YouTube upload state
        run: |
          if [ -n "$(git status --short viral-video-automation/youtube_uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add viral-video-automation/youtube_uploads
            git commit -m "Record daily quote YouTube upload"
            git push
          else
            echo "No YouTube upload state changes to commit."
          fi
      - name: Keep rendered video for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-quote-video
          path: viral-video-automation/output/daily_quote/*.mp4
          if-no-files-found: ignore
          retention-days: 7
